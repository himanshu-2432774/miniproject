<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer | Pet Shelter and Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/volunteer.css" />
</head>
<body>
  <header>
    <div class="container header-container">
      <a href="index.html" class="logo">Pet Shelter and Care</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="index.html#pets">Adopt</a>
        <a href="volunteer.html" class="active">Volunteer</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="volunteer">
      <div class="container">
        <div class="section-title">
          <h2>Volunteer With Us</h2>
          <p>Your time can save lives. Help our rescue animals find loving homes by joining our volunteer team.</p>
        </div>

        <form id="volunteerForm" class="form-container">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input id="firstName" name="firstName" class="form-control" placeholder="Enter your first name" required />
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input id="lastName" name="lastName" class="form-control" placeholder="Enter your last name" required />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" placeholder="Enter your email" required />
          </div>

          <button type="submit" class="btn btn-primary">Submit Application</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
